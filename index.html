<p class="sub rise" style="--d:.25s">Drill the names, monsters, and gods from the Golden Fleece, Perseus, and Hercules. Every question comes straight from your PDF.</p>
<div class="rise" style="--d:.4s"><h3>What do you want to review?</h3><div class="chips" id="sc">${sc.map(([k,l])=>`<button class="chip ${S.scope==k?"on":""}" data-k="${k}">${l}</button>`).join("")}</div>
<h3>How do you want to practice?</h3><div class="modes" id="md">${md.map(([k,i,t,d])=>`<button class="mode ${S.mode==k?"on":""}" data-k="${k}"><i>${i}</i><b>${t}</b><span>${d}</span></button>`).join("")}</div>
<button class="go" id="go">Begin the quest</button><p class="foot" id="cnt"></p></div>`;
const cnt=()=>$("#cnt").textContent=`${pool().length} questions ready. Matching rounds use five terms at a time.`;cnt();
const pick=(id,key)=>$$(id+" button").forEach(b=>b.onclick=()=>{S[key]=b.dataset.k;$$(id+" button").forEach(x=>x.classList.toggle("on",x==b));cnt()});
pick("#sc","scope");pick("#md","mode");$("#go").onclick=start}

const mk=p=>{const m=sh(p),r=[];for(let i=0;i<m.length;i+=5){let g=m.slice(i,i+5);if(g.length<5)g=g.concat(sh(m.filter(x=>!g.includes(x))).slice(0,5-g.length));r.push({t:"mt",its:g})}return r};
function start(){
const p=pool(),ids=sh(p).map(it=>({t:"id",it})),ms=mk(p);
run(S.mode=="id"?ids:S.mode=="mt"?ms:[...ids,...ms])}
function run(steps){R={steps,i:0,pts:0,miss:[],max:steps.reduce((a,s)=>a+(s.t=="id"?1:s.its.length),0)};step()}

function step(){
if(R.i>=R.steps.length)return end();
const s=R.steps[R.i];
app.innerHTML=`<div class="bar"><i style="width:${R.i/R.steps.length*100}%"></i></div><div class="top"><button class="ghost" id="hm">Exit</button><span>Question ${R.i+1} of ${R.steps.length}</span><b>${R.pts} pts</b></div><div id="st"></div>`;
$("#hm").onclick=home;requestAnimationFrame(()=>$(".bar i").style.width=(R.i+1)/R.steps.length*100+"%");
s.t=="id"?ident(s.it):match(s.its)}

function ident(it){
$("#st").innerHTML=`<div class="card in"><span class="tag">${SN[it.s]}</span><p class="q">${it.q}</p><div class="row"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer"><button class="go sm" id="ck">Check</button></div><div class="row2"><button class="ghost" id="hn">Hint</button><button class="ghost" id="rv">Show answer</button></div><div class="ht" id="ht"></div><div id="fb"></div></div>`;
const inp=$("#ans"),ck=$("#ck");let done=0;
const fin=g=>{done=1;g?R.pts++:miss(it);inp.readOnly=true;ck.textContent="Next";$("#fb").innerHTML=`<div class="fb ${g?"ok":"no"} in"><b>${g?"Correct!":"Not quite."}</b> ${g?"":"The answer is "}<strong>${it.a}</strong></div>`;$("#hn").hidden=$("#rv").hidden=true;$("#ht").hidden=true};
ck.onclick=()=>{if(done){R.i++;step();return}if(!nm(inp.value)){inp.classList.remove("bad");void inp.offsetWidth;inp.classList.add("bad");return}fin(ok(it,inp.value))};
inp.onkeydown=e=>{if(e.key=="Enter")ck.click()};
$("#hn").onclick=()=>$("#ht").textContent=it.a.split("").map((c,i)=>c==" "?"\u00a0":i?"_":c).join(" ");
$("#rv").onclick=()=>fin(0);inp.focus()}

function match(its){
let lo=its.map((_,i)=>i),ro=sh(lo),sel=null,left=its.length,k=0;const mi=new Set(),dn={};
const shake=x=>{x.classList.remove("bad");void x.offsetWidth;x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),600)};
$("#st").innerHTML=`<div class="card in"><div class="mtop"><div><span class="tag">Matching type</span><p class="q sm" style="margin:.4em 0 1em">Tap a term on the left, then the description that fits it. A \u2713 means you got it.</p></div><button class="chip" id="shf">\u21c4 Shuffle</button></div><div class="mg"><div class="col" id="lc"></div><div class="col" id="rc"></div></div><div id="fb" style="margin-top:16px"></div></div>`;
const bt=(i,c,t)=>`<button class="mb${c}${dn[i]!=null?" m":""}" data-i="${i}"${dn[i]!=null?` style="--h:${dn[i]}"`:""}>${t}</button>`;
const draw=()=>{
$("#lc").innerHTML=lo.map(i=>bt(i,sel===i?" sel":"",its[i].a)).join("");
$("#rc").innerHTML=ro.map(i=>bt(i," d",its[i].q)).join("");
$$("#lc .mb").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;$$("#lc .sel").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});
$$("#rc .mb").forEach(b=>b.onclick=()=>{
if(sel==null)return shake(b);
const a=sel,i=+b.dataset.i,ab=$(`#lc [data-i="${a}"]`);
if(a==i){sel=null;$("#fb").innerHTML="";dn[i]=[150,205,265,35,320][k++%5];if(!mi.has(i))R.pts++;draw();
if(!--left){$("#fb").innerHTML=`<button class="go sm in" id="nx">${R.i+1<R.steps.length?"Next round":"See results"}</button>`;$("#nx").onclick=()=>{R.i++;step()}}}
else{mi.add(a);miss(its[a]);shake(b);$("#fb").innerHTML=`<div class="fb no in">Not a match. Your term is still selected, so try another description.</div>`}})};
$("#shf").onclick=()=>{lo=sh(lo);ro=sh(ro);sel=null;draw()};
draw()}

function end(){
const p=R.pts/R.max,pc=Math.round(p*100),msg=pc>=90?"Heroic. The gods would place you among the stars.":pc>=70?"Well fought. A little more practice and you’ll be immortal.":pc>=50?"A solid start. Review what you missed and go again.":"Every legend starts somewhere. Study the review list and return.";
app.innerHTML=`<div class="card res in"><span class="tag">Quest complete</span><div class="ring"><svg viewBox="0 0 120 120"><circle class="rb" cx="60" cy="60" r="52"/><circle class="rf" cx="60" cy="60" r="52" style="--d:${326.7*(1-p)}"/></svg><b>${pc}%</b></div><h2>${R.pts} of ${R.max} points</h2><p class="sub" style="margin:0 auto">${msg}</p>${R.miss.length?`<h3>Review these</h3><ul class="rv">${R.miss.map(x=>`<li><b>${x.a}</b><span>${x.q}</span></li>`).join("")}</ul>`:""}<div class="acts">${R.miss.length?`<button class="go sm" id="dm">Drill ${R.miss.length} missed</button>`:""}<button class="go sm" id="ag">Play again</button><button class="ghost" id="hm">Home</button></div></div>`;
$("#hm").onclick=home;$("#ag").onclick=start;
if($("#dm")){const ms=[...R.miss];$("#dm").onclick=()=>run(sh(ms).map(it=>({t:"id",it})))}
if(pc>=70)for(let i=0;i<42;i++){const c=document.createElement("i");c.className="cf";c.style.cssText=`--x:${Math.random()*100}%;--c:${Math.random()*360|0};--dl:${Math.random()*.8}s`;document.body.append(c);setTimeout(()=>c.remove(),3500)}}

$("#th").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark"};
home();
</script></body></html>
